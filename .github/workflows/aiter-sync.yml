# Copyright Advanced Micro Devices, Inc.
# SPDX-License-Identifier: MIT
#
# Keeps the AMD packages on current AITER releases. Once a week (or on demand)
# it moves every package with a sync/*.toml to the latest ROCm/aiter release,
# or to the ref given when run by hand, with
# `scripts/update_aiter_package.py --to <ref>`, and opens a pull request with
# the new submodule commits, pins and generated files. Nothing is published:
# the pull request goes through review, build, GPU tests and the release
# manager like any other change.
#
# Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository settings. Pull requests opened with GITHUB_TOKEN don't trigger
# other workflows, so CI won't start on them by itself; switch to a GitHub App
# token here once AMD GPU CI exists.

name: AITER sync

on:
  schedule:
    - cron: "17 6 * * 2" # Tuesdays, 06:17 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "AITER release tag or commit (default: the latest release)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: Move AMD packages to an AITER release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # push the sync branch
      pull-requests: write # open the pull request
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: true # zizmor: ignore[artipacked] the job pushes a branch

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Pick the AITER ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-$(gh release view --repo ROCm/aiter --json tagName --jq .tagName)}"
          if ! [[ "$ref" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::not a tag or commit: $ref"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Move every AMD package
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          for cfg in sync/*.toml; do
            python3 scripts/update_aiter_package.py "$cfg" --to "$REF"
          done

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "All AMD packages are already at AITER $REF."
            exit 0
          fi
          branch="aiter-sync/$REF"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists; its pull request is still open."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit --quiet -m "Move AMD packages to AITER $REF"
          git push --quiet origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Move AMD packages to AITER $REF" \
            --body "Generated by the AITER sync workflow with \`scripts/update_aiter_package.py --to $REF\` for every \`sync/*.toml\`.

          Before merging:
          - [ ] If AITER's Torch interface signatures changed, the package's \`torch-ext/torch_binding.cpp\` is updated.
          - [ ] \`version\` changes in \`sync/*.toml\` only if a package's Python API changed.
          - [ ] Builds pass, and correctness tests pass on gfx942 and gfx950.
          - [ ] Performance is no worse than the last release.
          - [ ] The release manager approves publishing."
